<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Presupuesto | JR Electricidad</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0e13;
      color: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .public-quote {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .quote-card {
      background: #11151c;
      border: 1px solid #252c36;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .35);
    }

    /* =========================
       HEADER
    ========================= */

    .quote-header {
      background: #11151c;
      padding: 28px 32px;
      border-bottom: 1px solid #292f38;
    }

    .quote-brand {
      color: #ffc400;
      font-size: 25px;
      font-weight: 900;
    }

    .quote-subtitle {
      color: #aeb5c0;
      font-size: 13px;
      margin-top: 6px;
    }

    /* =========================
       CONTENIDO
    ========================= */

    .quote-content {
      padding: 30px 32px;
    }

    .quote-number {
      color: #ffc400;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    /* =========================
       CLIENTE
    ========================= */

    .quote-client {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .quote-info {
      background: #171c24;
      border: 1px solid #272f39;
      border-radius: 10px;
      padding: 14px;
    }

    .quote-label {
      color: #858e9b;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .quote-value {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    /* =========================
       TABLA
    ========================= */

    .quote-items {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .quote-items th {
      text-align: left;
      color: #858e9b;
      font-size: 11px;
      text-transform: uppercase;
      padding: 12px 8px;
      border-bottom: 1px solid #303742;
    }

    .quote-items td {
      padding: 14px 8px;
      border-bottom: 1px solid #242b34;
      font-size: 13px;
      color: #e9edf2;
    }

    .quote-items td:last-child,
    .quote-items th:last-child {
      text-align: right;
    }

    .quote-items td:nth-child(2),
    .quote-items th:nth-child(2) {
      text-align: center;
    }

    .quote-items td:nth-child(3),
    .quote-items th:nth-child(3) {
      text-align: right;
    }

    /* =========================
       TOTALES
    ========================= */

    .quote-totals {
      margin-top: 25px;
      margin-left: auto;
      width: 280px;
    }

    .quote-total-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      color: #b9c0ca;
      font-size: 13px;
    }

    .quote-total-final {
      border-top: 1px solid #3a424d;
      margin-top: 8px;
      padding-top: 14px;
      color: #ffc400;
      font-size: 21px;
      font-weight: 900;
    }

    /* =========================
       OBSERVACIONES
    ========================= */

    .quote-notes {
      margin-top: 28px;
      background: #171c24;
      border: 1px solid #272f39;
      border-radius: 10px;
      padding: 16px;
    }

    .quote-notes-title {
      color: #ffc400;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .quote-notes-text {
      color: #b9c0ca;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* =========================
       ACEPTAR / RECHAZAR
    ========================= */

    .quote-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #292f38;
    }

    .quote-actions button {
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      min-height: 42px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform .18s ease,
        opacity .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .quote-actions button:hover {
      transform: translateY(-1px);
    }

    .quote-actions button:active {
      transform: translateY(0);
    }

    .quote-actions button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .quote-accept-btn {
      background: #ffc400;
      color: #11151c;
      box-shadow: 0 5px 18px rgba(255, 196, 0, .12);
    }

    .quote-accept-btn:hover {
      background: #ffd02f;
      box-shadow: 0 7px 22px rgba(255, 196, 0, .22);
    }

    .quote-reject-btn {
      background: #1a2029;
      border: 1px solid #343c48 !important;
      color: #d8dde5;
    }

    .quote-reject-btn:hover {
      background: #222a35;
      border-color: #596575 !important;
    }

    /* =========================
       RESPUESTA
    ========================= */

    .quote-response {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }

    .quote-response.success {
      display: block;
      background: rgba(70, 190, 120, .10);
      border: 1px solid rgba(70, 190, 120, .25);
      color: #78df9f;
    }

    .quote-response.error {
      display: block;
      background: rgba(255, 80, 80, .10);
      border: 1px solid rgba(255, 80, 80, .25);
      color: #ff8a8a;
    }

    /* =========================
       CARGANDO / ERROR
    ========================= */

    .quote-loading,
    .quote-error {
      text-align: center;
      padding: 60px 20px;
      color: #aeb5c0;
    }

    .quote-error {
      color: #ff7777;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 650px) {

      .public-quote {
        width: 94%;
        margin: 20px auto;
      }

      .quote-header,
      .quote-content {
        padding: 22px 18px;
      }

      .quote-client {
        grid-template-columns: 1fr;
      }

      .quote-items {
        display: block;
        overflow-x: auto;
      }

      .quote-items table {
        min-width: 600px;
      }

      .quote-totals {
        width: 100%;
      }

      .quote-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .quote-actions button {
        width: 100%;
      }
    }
  .quote-signature-box{margin-top:24px;background:#171c24;border:1px solid #272f39;border-radius:12px;padding:18px}.quote-signature-title{color:#ffc400;font-weight:900;font-size:16px}.quote-signature-box p{color:#aeb5c0;font-size:12px;line-height:1.5}.quote-signature-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.quote-signature-fields input{width:100%;box-sizing:border-box;background:#0f1319;color:#fff;border:1px solid #303742;border-radius:8px;padding:11px}.quote-signature-canvas-wrap{background:#fff;border-radius:10px;padding:6px}.quote-signature-canvas-wrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}.quote-signature-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}.quote-signature-actions button{border:0;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}@media(max-width:650px){.quote-signature-fields{grid-template-columns:1fr}.quote-signature-actions{flex-direction:column}.quote-signature-actions button{width:100%}}</style>
</head>

<body>

  <main class="public-quote">

    <div id="quoteContainer">
      <div class="quote-card">
        <div class="quote-loading">
          Cargando presupuesto...
        </div>
      </div>
    </div>

  </main>

  <script src="/js/public-quote.js"></script>

</body>
</html>
