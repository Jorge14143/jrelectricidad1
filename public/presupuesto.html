<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Presupuesto | JR Electricidad</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0e13;
      color: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .public-quote {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .quote-card {
      background: #11151c;
      border: 1px solid #252c36;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .35);
    }

    /* =========================
       HEADER
    ========================= */

    .quote-header {
      background: #11151c;
      padding: 28px 32px;
      border-bottom: 1px solid #292f38;
    }

    .quote-brand {
      color: #ffc400;
      font-size: 25px;
      font-weight: 900;
    }

    .quote-subtitle {
      color: #aeb5c0;
      font-size: 13px;
      margin-top: 6px;
    }

    /* =========================
       CONTENIDO
    ========================= */

    .quote-content {
      padding: 30px 32px;
    }

    .quote-number {
      color: #ffc400;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    /* =========================
       CLIENTE
    ========================= */

    .quote-client {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .quote-info {
      background: #171c24;
      border: 1px solid #272f39;
      border-radius: 10px;
      padding: 14px;
    }

    .quote-label {
      color: #858e9b;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .quote-value {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    /* =========================
       TABLA
    ========================= */

    .quote-items {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .quote-items th {
      text-align: left;
      color: #858e9b;
      font-size: 11px;
      text-transform: uppercase;
      padding: 12px 8px;
      border-bottom: 1px solid #303742;
    }

    .quote-items td {
      padding: 14px 8px;
      border-bottom: 1px solid #242b34;
      font-size: 13px;
      color: #e9edf2;
    }

    .quote-items td:last-child,
    .quote-items th:last-child {
      text-align: right;
    }

    .quote-items td:nth-child(2),
    .quote-items th:nth-child(2) {
      text-align: center;
    }

    .quote-items td:nth-child(3),
    .quote-items th:nth-child(3) {
      text-align: right;
    }

    /* =========================
       TOTALES
    ========================= */

    .quote-totals {
      margin-top: 25px;
      margin-left: auto;
      width: 280px;
    }

    .quote-total-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      color: #b9c0ca;
      font-size: 13px;
    }

    .quote-total-final {
      border-top: 1px solid #3a424d;
      margin-top: 8px;
      padding-top: 14px;
      color: #ffc400;
      font-size: 21px;
      font-weight: 900;
    }

    /* =========================
       OBSERVACIONES
    ========================= */

    .quote-notes {
      margin-top: 28px;
      background: #171c24;
      border: 1px solid #272f39;
      border-radius: 10px;
      padding: 16px;
    }

    .quote-notes-title {
      color: #ffc400;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .quote-notes-text {
      color: #b9c0ca;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* =========================
       ACEPTAR / RECHAZAR
    ========================= */

    .quote-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #292f38;
    }

    .quote-actions button {
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      min-height: 42px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform .18s ease,
        opacity .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .quote-actions button:hover {
      transform: translateY(-1px);
    }

    .quote-actions button:active {
      transform: translateY(0);
    }

    .quote-actions button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .quote-accept-btn {
      background: #ffc400;
      color: #11151c;
      box-shadow: 0 5px 18px rgba(255, 196, 0, .12);
    }

    .quote-accept-btn:hover {
      background: #ffd02f;
      box-shadow: 0 7px 22px rgba(255, 196, 0, .22);
    }

    .quote-reject-btn {
      background: #1a2029;
      border: 1px solid #343c48 !important;
      color: #d8dde5;
    }

    .quote-reject-btn:hover {
      background: #222a35;
      border-color: #596575 !important;
    }

    /* =========================
       RESPUESTA
    ========================= */

    .quote-response {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }

    .quote-response.success {
      display: block;
      background: rgba(70, 190, 120, .10);
      border: 1px solid rgba(70, 190, 120, .25);
      color: #78df9f;
    }

    .quote-response.error {
      display: block;
      background: rgba(255, 80, 80, .10);
      border: 1px solid rgba(255, 80, 80, .25);
      color: #ff8a8a;
    }

    /* =========================
       CARGANDO / ERROR
    ========================= */

    .quote-loading,
    .quote-error {
      text-align: center;
      padding: 60px 20px;
      color: #aeb5c0;
    }

    .quote-error {
      color: #ff7777;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 650px) {

      .public-quote {
        width: 94%;
        margin: 20px auto;
      }

      .quote-header,
      .quote-content {
        padding: 22px 18px;
      }

      .quote-client {
        grid-template-columns: 1fr;
      }

      .quote-items {
        display: block;
        overflow-x: auto;
      }

      .quote-items table {
        min-width: 600px;
      }

      .quote-totals {
        width: 100%;
      }

      .quote-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .quote-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="public-quote">

    <div id="quoteContainer">
      <div class="quote-card">
        <div class="quote-loading">
          Cargando presupuesto...
        </div>
      </div>
    </div>

  </main>

  <script>
    "use strict";

    /*
      =========================================================
      PRESUPUESTO PÚBLICO
      =========================================================
    */

    const quoteContainer = document.getElementById("quoteContainer");

    /*
      Obtener token desde:

      /presupuesto/TOKEN
    */

    const pathParts = window.location.pathname
      .split("/")
      .filter(Boolean);

    const token = pathParts[pathParts.length - 1] || "";

    /*
      =========================================================
      FORMATO DE FECHA
      =========================================================
    */

    function formatDate(value) {
      if (!value) {
        return "-";
      }

      /*
        Si MySQL devuelve un objeto Date,
        usamos UTC para evitar que Argentina
        cambie el día por zona horaria.
      */

      if (value instanceof Date) {
        const day = String(value.getUTCDate()).padStart(2, "0");
        const month = String(value.getUTCMonth() + 1).padStart(2, "0");
        const year = value.getUTCFullYear();

        return `${day}/${month}/${year}`;
      }

      const text = String(value).trim().slice(0, 10);

      const match = text.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );

      if (match) {
        return `${match[3]}/${match[2]}/${match[1]}`;
      }

      return text;
    }

    /*
      =========================================================
      FORMATO DE DINERO
      =========================================================
    */

    function formatMoney(value) {
      const number = Number(value) || 0;

      return number.toLocaleString("es-AR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    /*
      =========================================================
      ESCAPE HTML
      =========================================================
    */

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /*
      =========================================================
      ESTADO
      =========================================================
    */

    function getStatusText(status) {
      switch (status) {
        case "borrador":
          return "Pendiente de respuesta";

        case "enviado":
          return "Enviado";

        case "aceptado":
          return "Aceptado";

        case "rechazado":
          return "Rechazado";

        case "vencido":
          return "Vencido";

        case "cerrado":
          return "Cerrado";

        default:
          return status || "-";
      }
    }

    /*
      =========================================================
      CARGAR PRESUPUESTO
      =========================================================
    */

    async function loadQuote() {

      if (!token) {
        quoteContainer.innerHTML = `
          <div class="quote-card">
            <div class="quote-error">
              Enlace de presupuesto inválido.
            </div>
          </div>
        `;

        return;
      }

      try {

        const response = await fetch(
          `/api/public/quotes/${encodeURIComponent(token)}`
        );

        if (!response.ok) {

          let errorMessage =
            "No se pudo cargar el presupuesto.";

          try {
            const errorData = await response.json();

            if (errorData && errorData.error) {
              errorMessage = errorData.error;
            }
          } catch (error) {
            // No hacemos nada.
          }

          throw new Error(errorMessage);
        }

        const quote = await response.json();

        if (!quote || !quote.id) {
          throw new Error(
            "El servidor no devolvió un presupuesto válido."
          );
        }

        /*
          =====================================================
          ITEMS
          =====================================================
        */

        const items = Array.isArray(quote.items)
          ? quote.items
          : [];

        let itemsHtml = "";

        if (items.length === 0) {

          itemsHtml = `
            <tr>
              <td colspan="4" style="text-align:center;">
                No hay conceptos cargados.
              </td>
            </tr>
          `;

        } else {

          itemsHtml = items.map(item => {

            const quantity =
              Number(item.quantity) || 0;

            const unitPrice =
              Number(item.unit_price) || 0;

            const total =
              Number(item.total) ||
              Number(item.item_total) ||
              quantity * unitPrice;

            return `
              <tr>
                <td>
                  ${escapeHtml(item.description || "-")}
                </td>

                <td>
                  ${escapeHtml(item.quantity ?? "-")}
                  ${escapeHtml(item.unit || "")}
                </td>

                <td>
                  $ ${formatMoney(unitPrice)}
                </td>

                <td>
                  $ ${formatMoney(total)}
                </td>
              </tr>
            `;

          }).join("");
        }

        /*
          =====================================================
          BOTONES
          =====================================================

          Solo aparecen mientras el presupuesto
          pueda recibir una respuesta.
        */

        const finalStatuses = [
          "aceptado",
          "rechazado",
          "cerrado"
        ];

        const showActions =
          !finalStatuses.includes(quote.status);

        const actionsHtml = showActions
          ? `
            <div id="quoteActions" class="quote-actions">

              <button
                type="button"
                class="quote-reject-btn"
                onclick="respondQuote('reject')"
              >
                ✕ Rechazar presupuesto
              </button>

              <button
                type="button"
                class="quote-accept-btn"
                onclick="respondQuote('accept')"
              >
                ✓ Aceptar presupuesto
              </button>

            </div>

            <div
              id="quoteResponse"
              class="quote-response"
            ></div>
          `
          : "";

        /*
          =====================================================
          HTML PRINCIPAL
          =====================================================
        */

        quoteContainer.innerHTML = `

          <div class="quote-card">

            <header class="quote-header">

              <div class="quote-brand">
                ⚡ JR ELECTRICIDAD
              </div>

              <div class="quote-subtitle">
                Presupuesto de trabajos eléctricos
              </div>

            </header>


            <section class="quote-content">

              <div class="quote-number">
                PRESUPUESTO ${escapeHtml(quote.quote_number)}
              </div>


              <div class="quote-client">

                <div class="quote-info">

                  <div class="quote-label">
                    Cliente
                  </div>

                  <div class="quote-value">
                    ${escapeHtml(
                      quote.client_name || "-"
                    )}
                  </div>

                </div>


                <div class="quote-info">

                  <div class="quote-label">
                    Teléfono
                  </div>

                  <div class="quote-value">
                    ${escapeHtml(
                      quote.client_phone || "-"
                    )}
                  </div>

                </div>


                <div class="quote-info">

                  <div class="quote-label">
                    Email
                  </div>

                  <div class="quote-value">
                    ${escapeHtml(
                      quote.client_email || "-"
                    )}
                  </div>

                </div>


                <div class="quote-info">

                  <div class="quote-label">
                    Servicio
                  </div>

                  <div class="quote-value">
                    ${escapeHtml(
                      quote.requested_service || "-"
                    )}
                  </div>

                </div>

              </div>


              <table class="quote-items">

                <thead>

                  <tr>
                    <th>Concepto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Total</th>
                  </tr>

                </thead>

                <tbody>
                  ${itemsHtml}
                </tbody>

              </table>


              <div class="quote-totals">

                <div class="quote-total-row">

                  <span>
                    Subtotal
                  </span>

                  <strong>
                    $ ${formatMoney(quote.subtotal)}
                  </strong>

                </div>


                <div class="quote-total-row">

                  <span>
                    Descuento
                  </span>

                  <strong>
                    $ ${formatMoney(quote.discount)}
                  </strong>

                </div>


                <div class="quote-total-row quote-total-final">

                  <span>
                    TOTAL
                  </span>

                  <strong>
                    $ ${formatMoney(quote.total)}
                  </strong>

                </div>

              </div>


              ${
                quote.notes
                  ? `
                    <div class="quote-notes">

                      <div class="quote-notes-title">
                        Observaciones
                      </div>

                      <div class="quote-notes-text">
                        ${escapeHtml(quote.notes)}
                      </div>

                    </div>
                  `
                  : ""
              }


              <div
                style="
                  margin-top:24px;
                  color:#858e9b;
                  font-size:12px;
                "
              >

                <strong style="color:#b9c0ca;">
                  Fecha de emisión:
                </strong>

                ${formatDate(quote.issue_date)}

                ${
                  quote.expiration_date
                    ? `
                      &nbsp;&nbsp;|&nbsp;&nbsp;

                      <strong style="color:#b9c0ca;">
                        Vencimiento:
                      </strong>

                      ${formatDate(quote.expiration_date)}
                    `
                    : ""
                }

                &nbsp;&nbsp;|&nbsp;&nbsp;

                <strong style="color:#b9c0ca;">
                  Estado:
                </strong>

                ${escapeHtml(
                  getStatusText(quote.status)
                )}

              </div>


              ${actionsHtml}

            </section>

          </div>
        `;

      } catch (error) {

        console.error(
          "Error cargando presupuesto:",
          error
        );

        quoteContainer.innerHTML = `
          <div class="quote-card">

            <div class="quote-error">

              <div style="
                font-size:32px;
                margin-bottom:12px;
              ">
                ⚠
              </div>

              <div style="
                font-size:16px;
                font-weight:800;
                margin-bottom:8px;
              ">
                No se pudo cargar el presupuesto
              </div>

              <div>
                ${escapeHtml(error.message)}
              </div>

            </div>

          </div>
        `;
      }
    }

    /*
      =========================================================
      ACEPTAR / RECHAZAR
      =========================================================
    */

    async function respondQuote(action) {

      const actionContainer =
        document.getElementById("quoteActions");

      const responseBox =
        document.getElementById("quoteResponse");

      if (!actionContainer || !responseBox) {
        console.error(
          "No se encontraron los controles del presupuesto."
        );

        return;
      }

      let message = "";

      if (action === "accept") {

        const confirmed = confirm(
          "¿Querés aceptar este presupuesto?"
        );

        if (!confirmed) {
          return;
        }

        message = "Aceptando presupuesto...";

      } else if (action === "reject") {

        const confirmed = confirm(
          "¿Querés rechazar este presupuesto?"
        );

        if (!confirmed) {
          return;
        }

        message = "Rechazando presupuesto...";

      } else {
        return;
      }

      const buttons =
        actionContainer.querySelectorAll("button");

      buttons.forEach(button => {
        button.disabled = true;
      });

      responseBox.className = "quote-response success";
      responseBox.textContent = message;

      try {

        const response = await fetch(
          `/api/public/quotes/${encodeURIComponent(token)}/${action}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "No se pudo registrar la respuesta."
          );
        }

        responseBox.className =
          "quote-response success";

        responseBox.textContent =
          data.message ||
          (
            action === "accept"
              ? "✓ Presupuesto aceptado correctamente."
              : "✓ Presupuesto rechazado correctamente."
          );

        /*
          Ocultamos los botones después de responder.
        */

        actionContainer.style.display = "none";

      } catch (error) {

        console.error(
          "Error respondiendo presupuesto:",
          error
        );

        responseBox.className =
          "quote-response error";

        responseBox.textContent =
          error.message ||
          "No se pudo registrar la respuesta.";

        buttons.forEach(button => {
          button.disabled = false;
        });
      }
    }

    /*
      =========================================================
      INICIAR
      =========================================================
    */

    loadQuote();

  </script>

</body>
</html>
